spring:
 ai:
  model:
      chat: ollama
      embedding: ollama
  ollama:
   base-url: http://localhost:11434
   chat:
        options:
          model: llama3
          temperature: 0.4
   embedding:
        options:
          model: nomic-embed-text
  vectorstore:
   chroma:
      store:
        host: http://localhost
        port: 8000
        collection-name: ecommerce-knowledge-base
        initialize-schema: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true